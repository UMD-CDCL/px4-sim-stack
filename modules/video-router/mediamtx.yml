# The video contract.
#
# Everything that produces video publishes here. Everything that consumes video
# reads rtsp://video-router:8554/<name>. Swap the simulator for a real airframe
# and the consumers do not change, because the names do not change.
#
# Ingest options for a producer:
#   RTSP  rtspclientsink location=rtsp://video-router:8554/<name>   (what sim uses)
#   RTMP  rtmpsink location=rtmp://video-router:1935/<name>
#   RTP   set a path source to udp+rtp://0.0.0.0:<port>, see pilot_rtp below
#
# Read options for a consumer:
#   RTSP     rtsp://video-router:8554/<name>
#   WebRTC   http://localhost:8889/<name>        in a browser, lowest latency
#   HLS      http://localhost:8888/<name>        wide compatibility, ~2 s behind
#
# What a picture says about itself:
#
# A producer may write the instant it took a picture into the picture, as an
# H.265 or H.264 user_data_unregistered SEI holding the 16 byte identifier
# 9d2c5f1a6b844e37a10c7e53d89142b6 and then eight bytes of Unix nanoseconds,
# most significant first. 30 bytes for each picture. A consumer that localizes
# what it sees needs the instant the shutter opened, and no absolute time
# survives this router: MediaMTX times each frame by its own clock, so the RTCP
# sender report a reader receives names when the frame arrived here. Inside the
# bitstream nothing rewrites it. A decoder is required to skip an SEI it does
# not know, so a consumer that ignores this reads the stream as before.
#
# Written by modules/sim/gz_video_streamer/main.cc, read by
# ds_ros_pipeline/source.py. Both name the same 16 bytes.

logLevel: info
logDestinations: [stdout]

# The HTTP API answers "which streams are live right now", which is the first
# question when a player says it cannot connect. `px4sim streams` reads it.
api: true
apiAddress: :9997

# MediaMTX grants anonymous users publish, read and playback, but not api. The
# API therefore answers 401 until it is granted here. Publishing and reading
# stay open to anyone on the compose network, and the API is limited to this
# host and the docker subnet, because port 9997 is published.
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    ips: ['127.0.0.1/32', '::1/128', '172.16.0.0/12', '10.0.0.0/8', '192.168.0.0/16']
    permissions:
      - action: api

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

rtsp: true
rtspAddress: :8554
# TCP first. On a docker bridge, UDP gives no real latency win and does lose
# packets once several readers attach.
rtspTransports: [tcp, udp]

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: false

webrtc: true
webrtcAddress: :8889
# Add your LAN address here to reach the WebRTC player from another machine.
webrtcAdditionalHosts: []

srt: false

pathDefaults:
  source: publisher
  # Hold the stream open for a few seconds after the last reader leaves, so
  # that a DeepStream restart does not have to wait for a fresh keyframe.
  sourceOnDemandCloseAfter: 10s

paths:
  # --------------------------------------------------------- from the vehicle
  # The vehicles publish over RTSP and name their own mounts, one full stream
  # and one low-rate stream for each camera, with the UAS number appended:
  #
  #   v2   pilot<N>  pilotl<N>  thermal<N>  thermall<N>
  #   v3   rgb<N>    rgbl<N>    pilot<N>    pilotl<N>    thermal<N>  thermall<N>
  #
  # docs/uas-contract.md fixes those names. They are not listed here because
  # the list would have to change with the fleet, and all_others below already
  # accepts a publisher. Add a named path when you want one to be the record.

  # No annotated stream is served here. ds_node draws its boxes as ROS
  # annotations beside the image, which is what the aircraft does, so a second
  # video path would be a picture nothing on the aircraft produces.

  # --------------------------------------------------------------- examples
  # A real camera that sends plain RTP, with no RTSP server of its own.
  # Point the camera at video-router UDP 8100 and read rtsp://.../pilot_rtp.
  # pilot_rtp:
  #   source: udp+rtp://0.0.0.0:8100

  # Anything else a producer invents. Remove this to enforce the named list.
  all_others:
    source: publisher
