# The video contract.
#
# Everything that produces video publishes here. Everything that consumes video
# reads rtsp://video-router:8554/<name>. Swap the simulator for a real airframe
# and the consumers do not change, because the names do not change.
#
# Ingest options for a producer:
#   RTSP  rtspclientsink location=rtsp://video-router:8554/<name>   (what sim uses)
#   RTMP  rtmpsink location=rtmp://video-router:1935/<name>
#   RTP   set a path source to udp+rtp://0.0.0.0:<port>, see nadir_rtp below
#
# Read options for a consumer:
#   RTSP     rtsp://video-router:8554/<name>
#   WebRTC   http://localhost:8889/<name>        in a browser, lowest latency
#   HLS      http://localhost:8888/<name>        wide compatibility, ~2 s behind

logLevel: info
logDestinations: [stdout]

# The HTTP API answers "which streams are live right now", which is the first
# question when a player says it cannot connect. `px4sim streams` reads it.
api: true
apiAddress: :9997

# MediaMTX grants anonymous users publish, read and playback, but not api. The
# API therefore answers 401 until it is granted here. Publishing and reading
# stay open to anyone on the compose network, and the API is limited to this
# host and the docker subnet, because port 9997 is published.
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    ips: ['127.0.0.1/32', '::1/128', '172.16.0.0/12', '10.0.0.0/8', '192.168.0.0/16']
    permissions:
      - action: api

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

rtsp: true
rtspAddress: :8554
# TCP first. On a docker bridge, UDP gives no real latency win and does lose
# packets once several readers attach.
rtspTransports: [tcp, udp]

rtmp: true
rtmpAddress: :1935

hls: true
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: false

webrtc: true
webrtcAddress: :8889
# Add your LAN address here to reach the WebRTC player from another machine.
webrtcAdditionalHosts: []

srt: false

pathDefaults:
  source: publisher
  # Hold the stream open for a few seconds after the last reader leaves, so
  # that a DeepStream restart does not have to wait for a fresh keyframe.
  sourceOnDemandCloseAfter: 10s

paths:
  # --------------------------------------------------------- from the vehicle
  # The gimbal camera. sim publishes this over RTSP.
  gimbal:
    source: publisher

  # The fixed nadir camera.
  nadir:
    source: publisher

  # ------------------------------------------------------- from perception
  # DeepStream draws boxes and serves its own RTSP, one server for each camera.
  # The router pulls both in, so consumers keep one address for every stream.
  #
  # The port says which source, not which camera: 8554 is DeepStream's source 0
  # and 8555 is source 1. Those are RTSP_IN and RTSP_IN_2, which compose sets
  # from PERCEPTION_CAMERA and PERCEPTION_CAMERA_2. Swap those two variables and
  # these two names swap with them.
  #
  # sourceOnDemand means the router only connects when something asks, so with
  # ANNOTATED_STREAMS=0 these paths simply stay empty instead of erroring.
  nadir_annotated:
    source: rtsp://perception:8554/ds-test
    sourceOnDemand: true
    sourceOnDemandStartTimeout: 20s

  gimbal_annotated:
    source: rtsp://perception:8555/ds-test
    sourceOnDemand: true
    sourceOnDemandStartTimeout: 20s

  # --------------------------------------------------------------- examples
  # A real camera that sends plain RTP, with no RTSP server of its own.
  # Point the camera at video-router UDP 8100 and read rtsp://.../nadir_rtp.
  # nadir_rtp:
  #   source: udp+rtp://0.0.0.0:8100

  # Anything else a producer invents. Remove this to enforce the named list.
  all_others:
    source: publisher
