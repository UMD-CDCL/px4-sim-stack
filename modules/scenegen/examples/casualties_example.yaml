# Casualty ground-truth import file.
#
# scenegen imports this into scene.json: `create --casualties`,
# `all --casualties`, or the `import-casualties` command. After the
# import, scene.json owns the targets. The editor shows, places and moves
# them, and `build` writes the scenario from the scene alone. A re-import
# replaces imported targets and keeps hand-placed ones.
#
# Each entry:
#   lat, lon   required, WGS84 degrees
#   agl        optional meters above the terrain. Absent or null puts
#              the target on the ground.
#   model      optional model URI. Absent draws from the pool at build,
#              by a stable hash, so a rebuild never reshuffles.
#   name       optional. Keep "casualty" or "person" in it; the build
#              fixes a name the scorer would ignore.
#
# These three sit on McKeldin Mall for the umd_campus example scene.

casualties:
  - lat: 38.98625
    lon: -76.94330
  - lat: 38.98600
    lon: -76.94180
    model: https://fuel.gazebosim.org/1.0/OpenRobotics/models/Casual female
  - lat: 38.98660
    lon: -76.94255
    name: casualty_mall_east
