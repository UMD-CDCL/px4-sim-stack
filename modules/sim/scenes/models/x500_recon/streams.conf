# Camera streams for x500_recon.
#
# One line for each camera:
#   <name>  <topic regex>  <bitrate kbit/s>  <fps>
#
# The name becomes the last path element of the RTSP URL, so the first line
# below publishes rtsp://video-router:8554/gimbal.
#
# The gimbal camera comes from the upstream PX4 gimbal model, so its topic
# carries the world name and the model instance name. The regex skips both.
# The nadir camera is ours, and model.sdf gives it a short fixed topic.

gimbal  ^/world/[^/]+/model/[^/]+/link/camera_link/sensor/camera/image$  2500  15
nadir   ^/recon/nadir/image$                                            2500  15
