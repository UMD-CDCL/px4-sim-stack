# Camera streams for chimera_v2.
#
# One line for each stream:
#   <name>  <topic regex>  <bitrate kbit/s>  <fps>  <width>  <height>
#
# The entrypoint substitutes ${UAS_NUM} and ${GZ_MODEL} before it reads this
# file, so uas13 publishes rtsp://video-router:8554/pilot13 from the Gazebo model
# uas13_12. The model instance is in the regex because every camera keeps
# its default gz topic, which is the only topic that is unique per vehicle.
#
# width and height rescale the encoder input. `-` keeps the sensor size.
# Every camera renders once and feeds both of its streams, so a second stream
# costs one encode and no extra render.

pilot${UAS_NUM}     ^/world/[^/]+/model/${GZ_MODEL}/link/gimbal_camera_link/sensor/gimbal_camera/image$                         8000  15     -     -
pilotl${UAS_NUM}    ^/world/[^/]+/model/${GZ_MODEL}/link/gimbal_camera_link/sensor/gimbal_camera/image$                         1000  15   640   360
thermal${UAS_NUM}   ^/world/[^/]+/model/${GZ_MODEL}/link/thermal_camera_link/sensor/thermal_camera/image$         2000  15     -     -
thermall${UAS_NUM}  ^/world/[^/]+/model/${GZ_MODEL}/link/thermal_camera_link/sensor/thermal_camera/image$          400  15     -     -
