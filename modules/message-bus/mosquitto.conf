# The detection contract.
#
# DeepStream publishes detections here. Any consumer subscribes. The bus is
# deliberately dumb: no schema enforcement, no persistence, no auth. It exists
# so that perception and autonomy do not have to share a process, a language
# or a ROS distribution.
#
# Topics in use:
#   perception/detections        one JSON message for each frame that has objects
#   perception/status            heartbeat and pipeline state
#
# This config is open to the compose network only. Do not expose port 1883 to
# an untrusted network without adding a password file.

listener 1883 0.0.0.0
allow_anonymous true

# Websockets, so a browser dashboard can subscribe without a proxy.
listener 9001 0.0.0.0
protocol websockets

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# A slow subscriber must not stall the publisher. Detections are only useful
# fresh, so drop them rather than queue them.
max_queued_messages 100
max_inflight_messages 20
