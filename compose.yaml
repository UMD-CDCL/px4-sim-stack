name: px4simstack

# ---------------------------------------------------------------------------
# Reusable fragments.
# ---------------------------------------------------------------------------
x-gpu-env: &gpu-env
  NVIDIA_VISIBLE_DEVICES: all
  # `all` covers compute, graphics, video and display. Gazebo needs graphics,
  # the GStreamer NVENC encoder needs video, DeepStream needs compute.
  NVIDIA_DRIVER_CAPABILITIES: all

x-x11-env: &x11-env
  DISPLAY: ${DISPLAY:-:0}
  XAUTHORITY: /tmp/.docker.xauth
  QT_X11_NO_MITSHM: "1"

# What the three ROS images are built from. DeepStream 7.1 on Ubuntu 22.04
# with ROS 2 Humble, everywhere, because that is what the aircraft is and
# because cdcl_umd_msgs does not decode across a distribution change.
#
# Only TensorRT varies, and only where the GPU is newer than the one the
# release shipped for. scripts/ds-select.sh reads the card and answers with all
# of these, and ./px4sim exports them before it reaches compose. The defaults
# here are the stock release with no accommodation, which is what `docker
# compose` on its own -- with no front door to resolve anything -- gets. Run
# `./px4sim doctor` to see what this machine chose and why.
x-deepstream: &deepstream
  DS_VERSION: ${DS_VERSION:-7.1}
  DS_IMAGE: ${DS_IMAGE:-nvcr.io/nvidia/deepstream:7.1-samples-multiarch}
  ROS_DISTRO: ${ROS_DISTRO:-humble}
  DS_CODENAME: ${DS_CODENAME:-jammy}
  # The built tag. onboard and offboard derive from ros-base by this name, so
  # it has to carry the accommodation as well as the release.
  DS_TAG: ${DS_TAG:-7.1}
  # Empty on every GPU up to Hopper, which is what the aircraft is. Set only
  # where the release's own TensorRT cannot emit kernels for the card.
  TRT_VERSION: ${DS_TRT_VERSION:-}
  TRT_CUDA: ${DS_TRT_CUDA:-}

x-ids: &ids
  # Named HOST_UID, not UID. A build argument reaches every RUN as an
  # environment variable, and a variable named UID shadows the one bash
  # sets, which makes a root-only install script refuse to run as root.
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}

# One mavlink-router for each vehicle. They differ only in the UAS number and
# the companion address, so everything else lives here.
x-mavlink-router: &mavlink-router
  build:
    context: ./modules/mavlink-router
  image: px4simstack/mavlink-router:1
  restart: unless-stopped

x-mavlink-router-env: &mavlink-router-env
  # The first simulated vehicle is UAS_BASE + 1. Every entry point derives
  # its identifiers from it, so the host and the container have to read the
  # same number: scripts/fleet.sh holds the same default.
  UAS_BASE: ${UAS_BASE:-10}
  # The UDP server PX4 pushes into. Every router has its own namespace, so
  # every router can use the same port. See modules/sim/px4-rcS.
  PX4_UPLINK_PORT: "14545"
  # Where the offboard endpoint sends. The default is the simnet gateway, which
  # is this host, so a ground mavlink-router listening on 14561 to 14569 picks
  # the fleet up exactly as it does in the field.
  GCS_ADDRESS: ${GCS_ADDRESS:-${SIMNET_PREFIX:-10.200.142}.210}
  # QGroundControl autoconnects on 14550. Empty removes that endpoint.
  QGC_ADDRESS: ${QGC_ADDRESS:-${SIMNET_PREFIX:-10.200.142}.224}
  KEEPALIVE: ${KEEPALIVE:-1}

# The onboard computer for each simulated vehicle. One container for each,
# because each binds MAVLink port 14402 and runs its own ROS domain. UAS_NUM is
# the whole identity: the entrypoint derives the MAVLink system id, the /uas<N>
# namespace, domain 6<N> and the d<N> and uas<N> frame prefixes from it.
#
# Each one shares its vehicle router's network namespace, so a vehicle is one
# machine with one address and the router reaches MAVROS on loopback.
#
# UAS_FLEET has to agree with the model for each UAS number: uas11 and uas12
# are v3, uas13 and uas14 are v2. Set UAS1<N>_MODEL to override one
# vehicle. ds_node reads the mount that
# modules/sim/scenes/models/chimera_v<n>/streams.conf serves for that model:
# rgb<N> on a v3 airframe and pilot<N> on a v2.
x-onboard: &onboard
  build:
    context: ./modules/onboard
    additional_contexts:
      # scripts/zoom.sh, the framing table. A build context cannot reach
      # outside itself, and the table has ONE copy: the simulator crops to a
      # preset and the companion writes the calibration for it, so a second
      # copy is two answers to what "mid" means.
      shared: ./scripts
    args:
      # Which ros-base to derive from. Everything heavy is there, so this image
      # is its entry point and nothing else. `./px4sim build` builds the base
      # first. See modules/ros-base/Dockerfile.
      <<: *deepstream
  image: px4simstack/onboard:${DS_TAG:-7.1}
  runtime: nvidia
  ipc: host
  stop_grace_period: 20s
  volumes:
    # Detector and classifier artifacts from scripts/convert_to_engine.py.
    # config/param_files/sim/onboard_sim_params.yaml names them. nvinfer builds
    # the TensorRT engine next to the ONNX on the first run, which takes 1 to 3
    # minutes and stays on this volume afterwards.
    - ${ONBOARD_MODEL_DIR:-./modules/onboard/models}:/models
    - ./logs/onboard:/logs
    # Terrain surfaces from `px4sim genscene`. The entry point links the one
    # for SCENE into /terrain, which is where tf_loc reads its cache from.
    - ./modules/sim/scenes:/scenes:ro
  # The world origin, so sim_ground_truth can put the scenario's targets on the
  # Earth. It reads PX4_HOME_LAT, _LON and _ALT and refuses to guess without
  # them, which leaves the vehicle with no ground truth and no verdicts. Same
  # file the sim and the ground station read. See scripts/origin-env.sh.
  env_file:
    - path: ./.origin.env
      required: false
  depends_on: [video-router]

x-onboard-env: &onboard-env
  # The first simulated vehicle is UAS_BASE + 1. Every entry point derives
  # its identifiers from it, so the host and the container have to read the
  # same number: scripts/fleet.sh holds the same default.
  UAS_BASE: ${UAS_BASE:-10}
  # One source of truth for the airframe of each vehicle. See modules/onboard/entrypoint.sh.
  UAS_FLEET: ${UAS_FLEET:-chimera_v3 chimera_v3 chimera_v2 chimera_v2}
  # The same list the simulator renders with. cam_info needs the calibration of
  # the camera that really produced the picture, and a simulated camera's is its
  # field of view. See modules/onboard/sim_calibration.py.
  UAS_GIMBAL_HFOV_DEG: ${UAS_GIMBAL_HFOV_DEG:-27.45 27.45 85.25 25.98}
  # The framing table. scripts/zoom.sh holds the same values as its own
  # defaults, so leaving these out is not an error: it is the host and the
  # container quietly reading two different tables. They were absent, and
  # .env's table had never reached a container.
  UAS_ZOOM_PRESETS: ${UAS_ZOOM_PRESETS:-narrow=6.09 mid=20.13 wide=56.06}
  UAS_ZOOM: ${UAS_ZOOM:-mid mid - -}
  UAS_ZOOM_STEPS: ${UAS_ZOOM_STEPS:-narrow=29000,32380 mid=34500,32980 wide=40000,31140}
  UAS_ZOOM_TRAVEL: ${UAS_ZOOM_TRAVEL:-zoom=29000,40000 focus=29500,33500}
  UAS_ZOOM_DATUM: ${UAS_ZOOM_DATUM:-zoom=32000 focus=32000}
  UAS_ZOOM_PORT_BASE: ${UAS_ZOOM_PORT_BASE:-5900}
  UAS_THERMAL_HFOV_DEG: ${UAS_THERMAL_HFOV_DEG:-29.75 29.75 31.03 29.75}
  <<: *gpu-env
  RTSP_BASE: rtsp://video-router:8554
  # Contract section 2. MAVROS binds 14402 and answers whoever reaches it, so
  # the router pushes and MAVROS never dials out.
  FCU_URL: ${FCU_URL:-udp://:14402@:14550}
  CUDA_CACHE_PATH: /models/.nv-compute
  SCENE: ${SCENE:-recon_field}
  # What sim_ground_truth scores against, the same pair the ground station
  # reads. Without them the node takes its own defaults, which name one
  # scenario, and every other scenario scores against the wrong targets.
  GROUND_TRUTH_FILE: /scenes/scenarios/${SCENARIO:-urban_casualties}.yaml
  RESOLVED_TRUTH_FILE: /scenes/ground_truth_actual.yaml
  # One more parameter file, loaded after every other. Where this machine names
  # what only it has, the detector artifacts above all. Put it in the model
  # directory, which is already mounted. See modules/onboard/models/README.md.
  ONBOARD_PARAMS_FILE: ${ONBOARD_PARAMS_FILE:-}

services:

  # -------------------------------------------------------------------------
  # ros-base - what the companion and the ground station are both made of.
  # Built, never run: DeepStream, ROS 2, MAVROS and the built ros2_ws, in one
  # image so the work happens once and one package list is maintained.
  # -------------------------------------------------------------------------
  ros-base:
    profiles: [base]
    build:
      context: ./modules/ros-base
      additional_contexts:
        # Where 5g_drone, cdcl_umd_msgs and MAVInsight are checked out. colcon
        # builds them into the image, so nothing is mounted at run time.
        ros2_ws: ${ROS2_WS_DIR:-../ros2_ws}
      args:
        <<: [*ids, *deepstream]
    image: px4simstack/ros-base:${DS_TAG:-7.1}
    command: ["true"]

  # -------------------------------------------------------------------------
  # sim - the vehicle. PX4 SITL, Gazebo Harmonic, the sensors, and the camera
  # encoders. This module owns physics and firmware. It publishes one MAVLink
  # port and one video stream for each camera. Nothing else.
  # -------------------------------------------------------------------------
  sim:
    build:
      context: ./modules/sim
      additional_contexts:
        # scripts/zoom.sh, the framing table. A build context cannot reach
        # outside itself, and the table has ONE copy: the simulator crops to a
        # preset and the companion writes the calibration for it, so a second
        # copy is two answers to what "mid" means.
        shared: ./scripts
      args:
        <<: *ids
        PX4_REF: ${PX4_REF:-v1.17.0}
        GZ_DISTRO: ${GZ_DISTRO:-harmonic}
    image: px4simstack/sim:${PX4_REF:-v1.17.0}
    hostname: sim
    runtime: nvidia
    ipc: host
    stdin_open: true
    tty: true
    environment:
      <<: [*gpu-env, *x11-env]
      PX4_DIR: /px4
      SCENES_DIR: /scenes
      SCENE: ${SCENE:-recon_field}
      # The fleet, in UAS number order. One PX4 SITL instance for each entry,
      # started as `px4 -i <index>`, which gives MAV_SYS_ID = index + 1.
      # The fields of view are degrees and belong to the vehicle: uas13 and uas14
      # are both v2 and carry different lenses. See .env.example.
      UAS_FLEET: ${UAS_FLEET:-chimera_v3 chimera_v3 chimera_v2 chimera_v2}
      # The first simulated vehicle is UAS_BASE + 1. Every entry point derives
      # its identifiers from it, so the host and the container have to read the
      # same number: scripts/fleet.sh holds the same default.
      UAS_BASE: ${UAS_BASE:-10}
      UAS_GIMBAL_HFOV_DEG: ${UAS_GIMBAL_HFOV_DEG:-27.45 27.45 85.25 25.98}
      # The framing table. scripts/zoom.sh holds the same values as its own
      # defaults, so leaving these out is not an error: it is the host and the
      # container quietly reading two different tables. They were absent, and
      # .env's table had never reached a container.
      UAS_ZOOM_PRESETS: ${UAS_ZOOM_PRESETS:-narrow=6.09 mid=20.13 wide=56.06}
      UAS_ZOOM: ${UAS_ZOOM:-mid mid - -}
      UAS_ZOOM_STEPS: ${UAS_ZOOM_STEPS:-narrow=29000,32380 mid=34500,32980 wide=40000,31140}
      UAS_ZOOM_TRAVEL: ${UAS_ZOOM_TRAVEL:-zoom=29000,40000 focus=29500,33500}
      UAS_ZOOM_DATUM: ${UAS_ZOOM_DATUM:-zoom=32000 focus=32000}
      UAS_ZOOM_PORT_BASE: ${UAS_ZOOM_PORT_BASE:-5900}
      UAS_THERMAL_HFOV_DEG: ${UAS_THERMAL_HFOV_DEG:-29.75 29.75 31.03 29.75}
      UAS_DOWN_HFOV_DEG: ${UAS_DOWN_HFOV_DEG:-25.98 25.98 25.98 25.98}
      UAS_SPACING_M: ${UAS_SPACING_M:-1}
      # Which cameras each vehicle serves. See .env.example.
      UAS_STREAMS: ${UAS_STREAMS:-gimbal}
      # A scaled stream encodes in software by default, which keeps the
      # GPU's encoding sessions for the full size ones and the codec the
      # same either way. Set to anything else to put both on the GPU.
      VIDEO_SCALED_ENCODER: ${VIDEO_SCALED_ENCODER:-software}
      SCENARIO: ${SCENARIO:-}
      GZ_GUI: ${GZ_GUI:-0}
      VIDEO_SINK_BASE: rtsp://video-router:8554
      # The streamer probes the encoders and takes the first that works, H.265
      # before H.264, so a GPU whose driver has dropped the older NVENC presets
      # falls through instead of publishing nothing. Set these to name the
      # encoder yourself and skip the probe.
      VIDEO_ENCODER: ${VIDEO_ENCODER:-}
      VIDEO_PARSER: ${VIDEO_PARSER:-h264parse}
      # PX4 pushes telemetry to a fixed address, so a router restart does not
      # strand the link. uas<N> is at <base><N>. See modules/sim/px4-rcS.
      MAVLINK_ROUTER_IP_BASE: ${SIMNET_PREFIX:-10.200.142}.2
      MAVLINK_ROUTER_PORT: "14545"
      # PX4 reads these directly. See docs/interfaces.md. The entrypoint sets
      # PX4_SIM_MODEL and PX4_GZ_MODEL_POSE for each vehicle.
      PX4_SYS_AUTOSTART: ${AIRFRAME:-4019}
      PX4_SIM_SPEED_FACTOR: ${SIM_SPEED_FACTOR:-1}
      # PX4_HOME_LAT, PX4_HOME_LON and PX4_HOME_ALT come from .origin.env,
      # below. They are scene data, and a copy here would be a second origin
      # that can disagree with the world.
      # rcS turns every PX4_PARAM_* variable into a `param set` before the
      # MAVLink links start. This is the supported way to change PX4 parameters
      # without a patch to the PX4 tree.
      PX4_PARAM_MAV_0_FORWARD: "1"
      PX4_PARAM_COM_RCL_EXCEPT: "4"
    # The world origin, written by ./px4sim from the scene and the scenario.
    # See scripts/origin-env.sh. Without the file PX4 keeps the coordinates
    # the world file declares, which is the origin of that scene anyway.
    env_file:
      - path: ./.origin.env
        required: false
    volumes:
      - ./src/PX4-Autopilot:/px4
      - ./modules/sim/scenes:/scenes
      - ./logs/px4:/px4-logs
      - sim-ccache:/home/dev/.ccache
      - sim-fuel:/home/dev/.gz
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.220
    depends_on:
      video-router:
        condition: service_started
    stop_grace_period: 20s

  # -------------------------------------------------------------------------
  # uas11 to uas19 - the MAVLink contract, one router for each vehicle. Every
  # consumer talks to a router, never to PX4. Swap `sim` for a real airframe
  # and nothing downstream changes.
  #
  # Each one is its own container because each one binds TCP 5760 and pushes to
  # port 14402, which only separate network namespaces allow. That is also how
  # the aircraft is built.
  #
  # ./px4sim turns UAS_FLEET into the profile list, so a fleet of four starts
  # uas11 to uas14. The onboard container for a vehicle shares this container's
  # network namespace, so the companion endpoint is plain loopback and
  # main.conf.template needs no address of ours at all.
  # -------------------------------------------------------------------------
  uas11:
    <<: *mavlink-router
    profiles: [uas11]
    hostname: uas11
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "11"
    ports:
      - "5761:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
      # onboard11 borrows this network namespace and cannot publish a port
      # of its own, so its Foxglove bridge is published here. 8765 stays
      # free for the ground station.
      - "8771:8765"
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.211

  uas12:
    <<: *mavlink-router
    profiles: [uas12]
    hostname: uas12
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "12"
    ports:
      - "5762:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
      # onboard12 borrows this network namespace and cannot publish a port
      # of its own, so its Foxglove bridge is published here. 8765 stays
      # free for the ground station.
      - "8772:8765"
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.212

  uas13:
    <<: *mavlink-router
    profiles: [uas13]
    hostname: uas13
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "13"
    ports:
      - "5763:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
      # onboard13 borrows this network namespace and cannot publish a port
      # of its own, so its Foxglove bridge is published here. 8765 stays
      # free for the ground station.
      - "8773:8765"
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.213

  uas14:
    <<: *mavlink-router
    profiles: [uas14]
    hostname: uas14
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "14"
    ports:
      - "5764:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
      # onboard14 borrows this network namespace and cannot publish a port
      # of its own, so its Foxglove bridge is published here. 8765 stays
      # free for the ground station.
      - "8774:8765"
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.214

  uas15:
    <<: *mavlink-router
    profiles: [uas15]
    hostname: uas15
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "15"
    ports:
      - "5765:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.215

  uas16:
    <<: *mavlink-router
    profiles: [uas16]
    hostname: uas16
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "16"
    ports:
      - "5766:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.216

  uas17:
    <<: *mavlink-router
    profiles: [uas17]
    hostname: uas17
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "17"
    ports:
      - "5767:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.217

  uas18:
    <<: *mavlink-router
    profiles: [uas18]
    hostname: uas18
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "18"
    ports:
      - "5768:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.218

  uas19:
    <<: *mavlink-router
    profiles: [uas19]
    hostname: uas19
    environment:
      <<: *mavlink-router-env
      UAS_NUM: "19"
    ports:
      - "5769:5760"      # MAVLink over TCP, for MAVSDK and pymavlink
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.219

  # -------------------------------------------------------------------------
  # onboard11 to onboard14 - the 5g_drone and MAVInsight stack, one container
  # for each vehicle. Profile onboard<N>. This is what the router's onboard
  # endpoint feeds, and it is the flight code the aircraft runs.
  # -------------------------------------------------------------------------
  onboard11:
    <<: *onboard
    profiles: [onboard11]
    environment:
      <<: *onboard-env
      UAS_NUM: "11"
      MODEL: ${UAS11_MODEL:-}
    # One vehicle is one machine. Sharing the router's network namespace puts
    # the ROS stack and mavlink-router on the same address, which is what the
    # aircraft does, and lets the router reach MAVROS on 127.0.0.1:14402. The
    # namespace carries the name too, so this service sets no hostname: docker
    # refuses a container that asks for both.
    network_mode: service:uas11
    depends_on: [uas11]

  onboard12:
    <<: *onboard
    profiles: [onboard12]
    environment:
      <<: *onboard-env
      UAS_NUM: "12"
      MODEL: ${UAS12_MODEL:-}
    # One vehicle is one machine. Sharing the router's network namespace puts
    # the ROS stack and mavlink-router on the same address, which is what the
    # aircraft does, and lets the router reach MAVROS on 127.0.0.1:14402.
    network_mode: service:uas12
    depends_on: [uas12]

  onboard13:
    <<: *onboard
    profiles: [onboard13]
    environment:
      <<: *onboard-env
      UAS_NUM: "13"
      MODEL: ${UAS13_MODEL:-}
    # One vehicle is one machine. Sharing the router's network namespace puts
    # the ROS stack and mavlink-router on the same address, which is what the
    # aircraft does, and lets the router reach MAVROS on 127.0.0.1:14402.
    network_mode: service:uas13
    depends_on: [uas13]

  onboard14:
    <<: *onboard
    profiles: [onboard14]
    environment:
      <<: *onboard-env
      UAS_NUM: "14"
      MODEL: ${UAS14_MODEL:-}
    # One vehicle is one machine. Sharing the router's network namespace puts
    # the ROS stack and mavlink-router on the same address, which is what the
    # aircraft does, and lets the router reach MAVROS on 127.0.0.1:14402.
    network_mode: service:uas14
    depends_on: [uas14]

  # -------------------------------------------------------------------------
  # offboard - the ground station, one container for the whole fleet. Profile
  # offboard. It is the mirror of the onboard containers: the same image
  # shape, the same workspace, and MAVROS from apt.
  #
  # UAS_FLEET is the whole identity, the way UAS_NUM is for a vehicle. The
  # entry point turns it into the vehicle numbers and the airframe models, so
  # the fleet is written once, in .env, and the ground station follows it.
  #
  # It runs a listening MAVROS, a MAVInsight frame tree, a preview ds_node and
  # the viz nodes for each vehicle, plus one Foxglove bridge, one ground truth
  # publisher and one HIL dispatcher for all of them. Domain 60 throughout.
  #
  # The published 1456x ports are where the vehicle routers push. A simulated
  # vehicle sends to 14550 + N with N from 11, so the range is 14561 to 14569
  # and the real fleet keeps 14551 to 14559. GCS_ADDRESS
  # defaults to the simnet gateway, which is this host, so the fleet reaches
  # the ground station through these. Set GCS_ADDRESS=${SIMNET_PREFIX:-10.200.142}.210 to take the
  # direct path on simnet instead and leave the host out of it.
  # -------------------------------------------------------------------------
  offboard:
    profiles: [offboard]
    build:
      context: ./modules/offboard
      args:
        # See the onboard note above: everything heavy is in ros-base.
        <<: *deepstream
    image: px4simstack/offboard:${DS_TAG:-7.1}
    hostname: offboard
    runtime: nvidia
    ipc: host
    stop_grace_period: 20s
    environment:
      <<: [*gpu-env, *x11-env]
      UAS_FLEET: ${UAS_FLEET:-chimera_v3 chimera_v3 chimera_v2 chimera_v2}
      # The first simulated vehicle is UAS_BASE + 1. Every entry point derives
      # its identifiers from it, so the host and the container have to read the
      # same number: scripts/fleet.sh holds the same default.
      UAS_BASE: ${UAS_BASE:-10}
      # The ground station's own ROS domain. offboard.launch.py reads it and
      # falls back to 70, so leaving it out means .env cannot move the fleet.
      GROUND_DOMAIN: ${GROUND_DOMAIN:-70}
      # ds_node reads the LOW RATE mount of each gimbal camera, which is what
      # crosses the radio link on the aircraft: rgbl<N> on a v3, pilotl<N> on
      # a v2.
      RTSP_BASE: rtsp://video-router:8554
      SCENE: ${SCENE:-recon_field}
      # What sim_ground_truth scores against. The scenario says where each
      # casualty was asked to go; the resolved file says where Gazebo put it,
      # and wins where it exists.
      GROUND_TRUTH_FILE: /scenes/scenarios/${SCENARIO:-urban_casualties}.yaml
      RESOLVED_TRUTH_FILE: /scenes/ground_truth_actual.yaml
      CUDA_CACHE_PATH: /logs/.nv-compute
    # The world origin, so the ground truth lands where the scene put it. Same
    # file the sim reads. See scripts/origin-env.sh.
    env_file:
      - path: ./.origin.env
        required: false
    volumes:
      # Read only, and only the ground truth node and the terrain link read it.
      - ./modules/sim/scenes:/scenes:ro
      - ./logs/offboard:/logs
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    ports:
      - "8765:8765"                      # Foxglove bridge
      - "14561-14569:14561-14569/udp"    # the simulated fleet, into ground-router
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.210
    depends_on: [video-router]

  # -------------------------------------------------------------------------
  # ground-router - the ground station's mavlink-router, from
  # chimera-deploy/local/main.conf. Every vehicle arrives on 14550 + N and
  # leaves to loopback: 14401 for QGroundControl and 1440<N+1> for that
  # vehicle's MAVROS.
  #
  # It shares the offboard container's network namespace, because those
  # endpoints are loopback ones and MAVROS binds them there. That is also why
  # the ports above are published on offboard and not here.
  # -------------------------------------------------------------------------
  ground-router:
    <<: *mavlink-router
    profiles: [offboard]
    entrypoint: ["/bin/sh", "/opt/ground-router/entrypoint.sh"]
    environment:
      UAS_FLEET: ${UAS_FLEET:-chimera_v3 chimera_v3 chimera_v2 chimera_v2}
    volumes:
      - ./modules/offboard/mavlink-router:/opt/ground-router:ro
    network_mode: "service:offboard"
    depends_on: [offboard]
  # -------------------------------------------------------------------------
  # video-router - the video contract. Every camera enters here and leaves as
  # RTSP. Downstream modules know stream names, not encoders or transports.
  # -------------------------------------------------------------------------
  video-router:
    image: bluenviron/mediamtx:${MEDIAMTX_TAG:-1}
    hostname: video-router
    volumes:
      - ./modules/video-router/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"        # RTSP
      - "1935:1935"        # RTMP ingest
      - "8888:8888"        # HLS
      - "8889:8889"        # WebRTC
      - "8189:8189/udp"    # WebRTC ICE
      - "9997:9997"        # HTTP API, used by `px4sim streams`
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.222
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # qgc - QGroundControl, the released build. Use the qgc-dev profile to build
  # your own from source.
  # -------------------------------------------------------------------------
  qgc:
    build:
      context: ./modules/qgc
      dockerfile: Dockerfile
      args:
        <<: *ids
        QGC_REF: ${QGC_REF:-v5.0.8}
    image: px4simstack/qgc:${QGC_REF:-v5.0.8}
    hostname: qgc
    runtime: nvidia
    ipc: host
    environment:
      <<: [*gpu-env, *x11-env]
      # The stream QGC shows. The image defaults to a name no vehicle serves
      # any more, and the fleet numbers its streams. uas11's gimbal camera is
      # rgb11 on a v3 and pilot11 on a v2.
      QGC_VIDEO_URL: ${QGC_VIDEO_URL:-rtsp://video-router:8554/rgb11}
    # Joystick passthrough. QGroundControl reads game controllers through SDL,
    # which opens /dev/input/event*. The bind mount brings the nodes in, the
    # cgroup rule lets the container open input devices (char major 13), and
    # the group entry gives the non-root user read access, because the host
    # marks those nodes root:input. preflight writes INPUT_GID into .env.
    # PX4 SITL already accepts the result: its rcS defaults COM_RC_IN_MODE
    # to 1, joystick input.
    device_cgroup_rules:
      - "c 13:* rmw"
    group_add:
      - "${INPUT_GID:-107}"
    volumes:
      - /dev/input:/dev/input
      - qgc-config:/home/dev/.config
      - ./logs/qgc:/home/dev/Documents/QGroundControl
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.224
    depends_on: [video-router]

  # -------------------------------------------------------------------------
  # qgc-dev - a Qt build environment with the QGC source bind-mounted.
  # Profile: qgc-dev
  # -------------------------------------------------------------------------
  qgc-dev:
    profiles: [qgc-dev]
    build:
      context: ./modules/qgc
      dockerfile: Dockerfile.dev
      args:
        <<: *ids
        QT_VERSION: ${QT_VERSION:-6.8.3}
    image: px4simstack/qgc-dev:${QT_VERSION:-6.8.3}
    hostname: qgc-dev
    runtime: nvidia
    ipc: host
    stdin_open: true
    tty: true
    environment:
      <<: [*gpu-env, *x11-env]
      QGC_SRC: /qgc
    volumes:
      - ./src/qgroundcontrol:/qgc
      - qgc-config:/home/dev/.config
      - qgc-dev-ccache:/home/dev/.ccache
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.225

  # -------------------------------------------------------------------------
  # scenegen - builds a Gazebo scene from real map data: satellite imagery,
  # elevation tiles, OSM buildings, detected vehicles. Runs on demand and
  # exits; it is not part of the running stack. It writes worlds, models and
  # scenarios into modules/sim/scenes, which is why it mounts that directory
  # read-write - the one exception to the "no Gazebo path outside sim" rule.
  # Use it through ./px4sim genscene, which selects the profile and maps
  # port 8090 for the browser editor.
  # Profile: scenegen
  # -------------------------------------------------------------------------
  scenegen:
    profiles: [scenegen]
    build:
      context: ./modules/scenegen
      args:
        <<: *ids
    image: px4simstack/scenegen:1
    hostname: scenegen
    environment:
      DATA_DIR: /data
      SCENES_DIR: /scenes
    volumes:
      - ./modules/scenegen:/app
      - ./modules/scenegen/data:/data
      - ./modules/sim/scenes:/scenes
    ports:
      - "8090:8090"
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.229

  # -------------------------------------------------------------------------
  # xrce-agent - the uXRCE-DDS bridge. This puts PX4 uORB topics directly on
  # the ROS 2 graph and breaks the MAVLink-only contract on purpose. Turn it on
  # only for a stack that needs px4_msgs.
  # Profile: xrce
  # -------------------------------------------------------------------------
  xrce-agent:
    profiles: [xrce]
    build:
      context: ./modules/xrce-agent
      args:
        XRCE_AGENT_REF: ${XRCE_AGENT_REF:-v2.4.2}
    image: px4simstack/xrce-agent:${XRCE_AGENT_REF:-v2.4.2}
    hostname: xrce-agent
    environment:
      # The domain the uORB topics appear on. A vehicle holds 60 + N, so 71 is
      # uas11. An agent on another domain publishes where nothing listens.
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-71}
    command: ["MicroXRCEAgent", "udp4", "-p", "8888"]
    networks:
      simnet:
        ipv4_address: ${SIMNET_PREFIX:-10.200.142}.228

networks:
  simnet:
    driver: bridge
    ipam:
      config:
        # The addressing the fleet flies, in its own block: the ground station
        # is .210 where the real one is .60, uas<N> is .2<N> where the real one
        # is .6<N>, and simulator infrastructure sits at .220 upwards. So an
        # address reads as its real counterpart, and no simulated machine can
        # ever claim a real machine's address. See docs/uas-contract.md.
        #
        # The ADDRESSES deconflict. The SUBNET does not: a bridge on this range
        # shadows the whole real range on a host that is itself on the radio
        # network, .60 to .64 included. Set SIMNET_PREFIX to 172.28.0 there.
        - subnet: ${SIMNET_PREFIX:-10.200.142}.0/24

volumes:
  sim-ccache:
  sim-fuel:
  qgc-config:
  qgc-dev-ccache:
