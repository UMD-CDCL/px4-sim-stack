name: px4simstack

# ---------------------------------------------------------------------------
# Reusable fragments.
# ---------------------------------------------------------------------------
x-gpu-env: &gpu-env
  NVIDIA_VISIBLE_DEVICES: all
  # `all` covers compute, graphics, video and display. Gazebo needs graphics,
  # the GStreamer NVENC encoder needs video, DeepStream needs compute.
  NVIDIA_DRIVER_CAPABILITIES: all

x-x11-env: &x11-env
  DISPLAY: ${DISPLAY:-:0}
  XAUTHORITY: /tmp/.docker.xauth
  QT_X11_NO_MITSHM: "1"

x-ids: &ids
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}

services:

  # -------------------------------------------------------------------------
  # sim - the vehicle. PX4 SITL, Gazebo Harmonic, the sensors, and the camera
  # encoders. This module owns physics and firmware. It publishes one MAVLink
  # port and one video stream for each camera. Nothing else.
  # -------------------------------------------------------------------------
  sim:
    build:
      context: ./modules/sim
      args:
        <<: *ids
        PX4_REF: ${PX4_REF:-v1.17.0}
        GZ_DISTRO: ${GZ_DISTRO:-harmonic}
    image: px4simstack/sim:${PX4_REF:-v1.17.0}
    hostname: sim
    runtime: nvidia
    ipc: host
    stdin_open: true
    tty: true
    environment:
      <<: [*gpu-env, *x11-env]
      PX4_DIR: /px4
      SCENES_DIR: /scenes
      SCENE: ${SCENE:-recon_field}
      VEHICLE: ${VEHICLE:-x500_recon}
      SCENARIO: ${SCENARIO:-}
      GZ_GUI: ${GZ_GUI:-0}
      VIDEO_SINK_BASE: rtsp://video-router:8554
      # The streamer probes the H.264 encoders and takes the first that works,
      # so a GPU whose driver has dropped the older NVENC presets falls through
      # to the current element instead of publishing nothing. Set this to a
      # GStreamer fragment to name the encoder yourself and skip the probe.
      VIDEO_ENCODER: ${VIDEO_ENCODER:-}
      # Frame capture times go here. RTSP cannot carry them, and every
      # localized detection depends on them. See modules/sim/frame_clock.py.
      MQTT_HOST: message-bus
      MQTT_PORT: "1883"
      FRAME_CLOCK: "1"
      # PX4 pushes telemetry to this fixed address, so a hub restart does not
      # strand the link. See modules/sim/px4-rcS.
      MAVLINK_HUB_IP: 172.28.0.11
      MAVLINK_HUB_PORT: "14545"
      # PX4 reads these directly. See docs/interfaces.md.
      PX4_SYS_AUTOSTART: ${AIRFRAME:-4019}
      PX4_SIM_MODEL: gz_${VEHICLE:-x500_recon}
      PX4_GZ_STANDALONE: "1"
      PX4_SIM_SPEED_FACTOR: ${SIM_SPEED_FACTOR:-1}
      PX4_HOME_LAT: ${HOME_LAT:-38.9869}
      PX4_HOME_LON: ${HOME_LON:--76.9426}
      PX4_HOME_ALT: ${HOME_ALT:-20}
      # rcS turns every PX4_PARAM_* variable into a `param set` before the
      # MAVLink links start. This is the supported way to change PX4 parameters
      # without a patch to the PX4 tree.
      PX4_PARAM_MAV_0_FORWARD: "1"
      PX4_PARAM_COM_RCL_EXCEPT: "4"
    volumes:
      - ./src/PX4-Autopilot:/px4
      - ./modules/sim/scenes:/scenes
      - ./logs/px4:/px4-logs
      - sim-ccache:/home/dev/.ccache
      - sim-fuel:/home/dev/.gz
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    networks:
      simnet:
        ipv4_address: 172.28.0.10
    depends_on:
      video-router:
        condition: service_started
      message-bus:
        condition: service_started
    stop_grace_period: 20s

  # -------------------------------------------------------------------------
  # mavlink-hub - the MAVLink contract. Every consumer talks to this service,
  # never to PX4 directly. Swap `sim` for a real airframe and nothing
  # downstream changes.
  # -------------------------------------------------------------------------
  mavlink-hub:
    build:
      context: ./modules/mavlink-hub
    image: px4simstack/mavlink-hub:1
    hostname: mavlink-hub
    environment:
      PX4_HOST: 172.28.0.10   # sim
      PX4_PORT: "18570"
      QGC_HOST: 172.28.0.14   # qgc
      QGC_PORT: "14550"
      EXTRA_GCS_IP: ${HOST_GCS_IP:-}
      # The keepalive injects a GCS heartbeat so PX4 learns where to send
      # telemetry. See docs/interfaces.md for why this is needed.
      KEEPALIVE: "1"
    ports:
      - "5760:5760"        # MAVLink over TCP, for MAVSDK and pymavlink
      - "14550:14550/udp"  # a GCS on the host can bind this
      - "14552:14552/udp"  # free slot for mission tooling
    networks:
      simnet:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # video-router - the video contract. Every camera enters here and leaves as
  # RTSP. Downstream modules know stream names, not encoders or transports.
  # -------------------------------------------------------------------------
  video-router:
    image: bluenviron/mediamtx:${MEDIAMTX_TAG:-1}
    hostname: video-router
    volumes:
      - ./modules/video-router/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"        # RTSP
      - "1935:1935"        # RTMP ingest
      - "8888:8888"        # HLS
      - "8889:8889"        # WebRTC
      - "8189:8189/udp"    # WebRTC ICE
      - "9997:9997"        # HTTP API, used by `px4sim streams`
    networks:
      simnet:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # message-bus - the detection contract. DeepStream publishes here. Any ROS
  # stack, or no ROS stack, can subscribe.
  # -------------------------------------------------------------------------
  message-bus:
    image: eclipse-mosquitto:2
    hostname: message-bus
    volumes:
      - ./modules/message-bus/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
      - "9001:9001"        # MQTT over websockets, for browser tools
    networks:
      simnet:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # qgc - QGroundControl, the released build. Use the qgc-dev profile to build
  # your own from source.
  # -------------------------------------------------------------------------
  qgc:
    build:
      context: ./modules/qgc
      dockerfile: Dockerfile
      args:
        <<: *ids
        QGC_REF: ${QGC_REF:-v5.0.8}
    image: px4simstack/qgc:${QGC_REF:-v5.0.8}
    hostname: qgc
    runtime: nvidia
    ipc: host
    environment:
      <<: [*gpu-env, *x11-env]
    # Joystick passthrough. QGroundControl reads game controllers through SDL,
    # which opens /dev/input/event*. The bind mount brings the nodes in, the
    # cgroup rule lets the container open input devices (char major 13), and
    # the group entry gives the non-root user read access, because the host
    # marks those nodes root:input. preflight writes INPUT_GID into .env.
    # PX4 SITL already accepts the result: its rcS defaults COM_RC_IN_MODE
    # to 1, joystick input.
    device_cgroup_rules:
      - "c 13:* rmw"
    group_add:
      - "${INPUT_GID:-107}"
    volumes:
      - /dev/input:/dev/input
      - qgc-config:/home/dev/.config
      - ./logs/qgc:/home/dev/Documents/QGroundControl
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    networks:
      simnet:
        ipv4_address: 172.28.0.14
    depends_on: [mavlink-hub, video-router]

  # -------------------------------------------------------------------------
  # qgc-dev - a Qt build environment with the QGC source bind-mounted.
  # Profile: qgc-dev
  # -------------------------------------------------------------------------
  qgc-dev:
    profiles: [qgc-dev]
    build:
      context: ./modules/qgc
      dockerfile: Dockerfile.dev
      args:
        <<: *ids
        QT_VERSION: ${QT_VERSION:-6.8.3}
    image: px4simstack/qgc-dev:${QT_VERSION:-6.8.3}
    hostname: qgc-dev
    runtime: nvidia
    ipc: host
    stdin_open: true
    tty: true
    environment:
      <<: [*gpu-env, *x11-env]
      QGC_SRC: /qgc
    volumes:
      - ./src/qgroundcontrol:/qgc
      - qgc-config:/home/dev/.config
      - qgc-dev-ccache:/home/dev/.ccache
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    networks:
      simnet:
        ipv4_address: 172.28.0.15

  # -------------------------------------------------------------------------
  # ros - the autonomy stack. It sees RTSP and MAVLink. It does not see
  # Gazebo, and it does not link against PX4.
  # Profile: ros
  # -------------------------------------------------------------------------
  ros:
    profiles: [ros]
    build:
      context: ./modules/ros
      args:
        <<: *ids
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: px4simstack/ros:${ROS_DISTRO:-jazzy}
    hostname: ros
    runtime: nvidia
    ipc: host
    stdin_open: true
    tty: true
    environment:
      <<: [*gpu-env, *x11-env]
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_STACK: ${ROS_STACK:-baseline}
      # The whole drone interface, in three variables.
      FCU_URL: udp://:14555@mavlink-hub:14551
      RTSP_BASE: rtsp://video-router:8554
      MQTT_HOST: message-bus
      # Gimbal frame handling. GIMBAL_SOURCE is auto, setpoint or status.
      # The offsets are the constant the scene_tf diagnostic reports.
      # Camera fields of view, radians. Trim nadir without touching gimbal.
      # An estimate must land within this many metres of a target to count.
      SCORING_GATE_M: ${SCORING_GATE_M:-2.0}
      GIMBAL_HFOV: ${GIMBAL_HFOV:-2.0}
      NADIR_HFOV: ${NADIR_HFOV:-1.74}
      # The grid each camera image is sampled to before it is laid on the
      # ground plane. The launch file holds the defaults: 480x270 for the
      # gimbal, 240x135 for the nadir. GROUND_IMAGE_SIZE sets both cameras
      # at once, the per-camera variables each set one. 1920x1080 is 2.07
      # million points and 33 MB, which held a core at full load and
      # delivered nothing.
      GROUND_IMAGE_SIZE: ${GROUND_IMAGE_SIZE:-}
      GROUND_IMAGE_SIZE_GIMBAL: ${GROUND_IMAGE_SIZE_GIMBAL:-}
      GROUND_IMAGE_SIZE_NADIR: ${GROUND_IMAGE_SIZE_NADIR:-}
      GROUND_IMAGE_RATE: ${GROUND_IMAGE_RATE:-1.0}
      # The rtsp_camera H.264 decoder element. nvh264dec is the NVDEC option.
      RTSP_DECODER: ${RTSP_DECODER:-avdec_h264}
      # foxglove_bridge send buffer, bytes. The default 10 MB is smaller than
      # one ground projection cloud, and over the limit the bridge drops the
      # channel without logging anything.
      FOXGLOVE_SEND_BUFFER: ${FOXGLOVE_SEND_BUFFER:-209715200}
      # The same pair the perception service uses. detections_bridge scales
      # boxes from this space into the live image size, so a mismatch corrects
      # itself instead of putting every box in the wrong place.
      DS_WIDTH: ${DS_WIDTH:-1920}
      DS_HEIGHT: ${DS_HEIGHT:-1080}
      # Per camera corrections, as "camera=WxH", comma separated. Use this when
      # one camera's boxes land correctly and the other's do not, which happens
      # when the two DeepStream sources report in different spaces. Measure it
      # with scripts/check-annotation-scale.py. Example:
      #   DS_COORD_OVERRIDES=nadir=1280x720
      DS_COORD_OVERRIDES: ${DS_COORD_OVERRIDES:-}
      # Nadir mounting against base_link, metres and degrees. Trim these if the
      # downward image is not square with the airframe.
      NADIR_X: ${NADIR_X:-0.10}
      NADIR_Y: ${NADIR_Y:-0.0}
      NADIR_Z: ${NADIR_Z:--0.06}
      NADIR_ROLL: ${NADIR_ROLL:-0.0}
      NADIR_PITCH: ${NADIR_PITCH:-90.0}
      NADIR_YAW: ${NADIR_YAW:-0.0}
      # Where the gimbal orientation comes from: auto, setpoint or status.
      GIMBAL_SOURCE: ${GIMBAL_SOURCE:-auto}
      # What a click on the gimbal image does: roi, point or off.
      CLICK_MODE: ${CLICK_MODE:-roi}
      GIMBAL_OFFSET_ROLL: ${GIMBAL_OFFSET_ROLL:-0.0}
      GIMBAL_OFFSET_PITCH: ${GIMBAL_OFFSET_PITCH:-0.0}
      GIMBAL_OFFSET_YAW: ${GIMBAL_OFFSET_YAW:-0.0}
      GROUND_TRUTH_FILE: /scenes/scenarios/${SCENARIO:-urban_casualties}.yaml
      # Ground truth marker rate, hertz. 10 keeps the projected markers smooth.
      GROUND_TRUTH_RATE: ${GROUND_TRUTH_RATE:-10}
      # Whose verdicts color the truth bubbles, comma separated. The nadir
      # camera sees most of the scene from above, so counting it marks every
      # target in its view as a miss even while only the gimbal hunts.
      GROUND_TRUTH_CAMERAS: ${GROUND_TRUTH_CAMERAS:-gimbal}
      # How a detection ray becomes a ground position: "plane" uses a flat
      # plane at the takeoff altitude, "scene" follows the terrain and the
      # roofs from worlds/<SCENE>_surface.json, written by scenegen build.
      LOCALIZATION_MODE: ${LOCALIZATION_MODE:-plane}
      SCENE: ${SCENE:-recon_field}
      RESOLVED_TRUTH_FILE: /scenes/ground_truth_actual.yaml
      # Which camera feeds detection and localization. The nadir camera
      # looks straight down, which is what an overhead search wants, and
      # it needs no gimbal pointing to work.
      PERCEPTION_CAMERA: ${PERCEPTION_CAMERA:-nadir}
      PERCEPTION_CAMERA_2: ${PERCEPTION_CAMERA_2:-gimbal}
      FIDUCIAL_ENABLED: ${FIDUCIAL_ENABLED:-0}
      FIDUCIAL_SURVEYED_LAT: ${FIDUCIAL_SURVEYED_LAT:-0.0}
      FIDUCIAL_SURVEYED_LON: ${FIDUCIAL_SURVEYED_LON:-0.0}
      FIDUCIAL_SURVEYED_ALT: ${FIDUCIAL_SURVEYED_ALT:-0.0}
      FIDUCIAL_MEASURED_LAT: ${FIDUCIAL_MEASURED_LAT:-0.0}
      FIDUCIAL_MEASURED_LON: ${FIDUCIAL_MEASURED_LON:-0.0}
      FIDUCIAL_MEASURED_ALT: ${FIDUCIAL_MEASURED_ALT:-0.0}
    volumes:
      - ./modules/ros/stacks:/stacks
      - ./src/ros2_ws:/ws
      # Diagnostics that need a ROS graph, so they run in here rather than on
      # the host. check-annotation-scale.py lives here.
      - ./scripts:/scripts:ro
      # Ground truth for scoring, read only. This is the one simulator file the
      # ROS side reads, and only the evaluation node touches it. Nothing in the
      # flight path depends on it, and on real hardware you do not run that node.
      - ./modules/sim/scenes:/scenes:ro
      - ./logs/ros:/home/dev/.ros
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTH_FILE:-./.xauth}:/tmp/.docker.xauth
    ports:
      - "8765:8765"        # Foxglove bridge
    networks:
      simnet:
        ipv4_address: 172.28.0.16
    depends_on: [mavlink-hub, video-router, message-bus]

  # -------------------------------------------------------------------------
  # perception - DeepStream inference. RTSP in, annotated RTSP and MQTT
  # detections out. It has no ROS dependency.
  # Profile: perception
  # -------------------------------------------------------------------------
  perception:
    profiles: [perception]
    build:
      context: ./modules/perception
      args:
        DS_IMAGE: ${DS_IMAGE:-nvcr.io/nvidia/deepstream:8.0-samples-multiarch}
    # DS_TAG follows DS_IMAGE, so DeepStream 8.0 and 9.0 build to two names.
    # Sharing one name lets a release change overwrite the image already built,
    # and the only symptom is a container that stops at the first CUDA call.
    # Both front doors set the pair from scripts/ds-select.sh.
    image: px4simstack/perception:${DS_TAG:-ds8}
    hostname: perception
    runtime: nvidia
    environment:
      <<: *gpu-env
      DS_CONFIG: ${DS_CONFIG:-camera_detector.txt}
      # msgconv.txt turns these into the sensor ids that tag each payload,
      # which is how the ROS side tells the two cameras apart.
      PERCEPTION_CAMERA: ${PERCEPTION_CAMERA:-nadir}
      RTSP_IN: rtsp://video-router:8554/${PERCEPTION_CAMERA:-nadir}
      # The second camera. Each camera gets its own deepstream-app process,
      # and the payload's sensorId says which one a detection came from.
      RTSP_IN_2: rtsp://video-router:8554/${PERCEPTION_CAMERA_2:-gimbal}
      PERCEPTION_CAMERA_2: ${PERCEPTION_CAMERA_2:-gimbal}
      # Which cameras get a boxes-burned-in RTSP stream, served as
      # <camera>_annotated by the video router. A comma separated list of
      # camera names; 1 or all turns every camera on, 0 turns every camera
      # off. Default is the gimbal alone: QGC displays gimbal_annotated, and
      # Foxglove draws its own boxes over the plain streams. Each enabled
      # camera costs one H.264 encode on the GPU.
      ANNOTATED_STREAMS: ${ANNOTATED_STREAMS:-gimbal}
      # The resolution each pipeline works in. Keep it equal to the camera
      # resolution: nvstreammux then neither scales down, which would throw
      # away detail before the detector sees it, nor up, which would cost
      # bandwidth for no new information. It is also the coordinate space the
      # boxes come back in, and the ros service reads the same pair.
      DS_WIDTH: ${DS_WIDTH:-1920}
      DS_HEIGHT: ${DS_HEIGHT:-1080}
      MQTT_HOST: message-bus
      MQTT_PORT: "1883"
      MQTT_TOPIC: perception/detections
      # The CUDA JIT cache lands in the persisted perception-cache volume.
      CUDA_CACHE_PATH: /root/.cache/nv-compute
      CUDA_CACHE_MAXSIZE: "1073741824"
    volumes:
      - ./modules/perception/configs:/opt/perception/configs
      - ./modules/perception/app:/opt/perception/app
      - ./modules/perception/models:/opt/perception/models
      - ./logs/perception:/opt/perception/logs
      - perception-cache:/root/.cache
    networks:
      simnet:
        ipv4_address: 172.28.0.17
    depends_on: [video-router, message-bus]

  # -------------------------------------------------------------------------
  # scenegen - builds a Gazebo scene from real map data: satellite imagery,
  # elevation tiles, OSM buildings, detected vehicles. Runs on demand and
  # exits; it is not part of the running stack. It writes worlds, models and
  # scenarios into modules/sim/scenes, which is why it mounts that directory
  # read-write - the one exception to the "no Gazebo path outside sim" rule.
  # Use it through ./px4sim genscene, which selects the profile and maps
  # port 8090 for the browser editor.
  # Profile: scenegen
  # -------------------------------------------------------------------------
  scenegen:
    profiles: [scenegen]
    build:
      context: ./modules/scenegen
      args:
        <<: *ids
    image: px4simstack/scenegen:1
    hostname: scenegen
    environment:
      DATA_DIR: /data
      SCENES_DIR: /scenes
    volumes:
      - ./modules/scenegen:/app
      - ./modules/scenegen/data:/data
      - ./modules/sim/scenes:/scenes
    ports:
      - "8090:8090"
    networks:
      simnet:
        ipv4_address: 172.28.0.19

  # -------------------------------------------------------------------------
  # xrce-agent - the uXRCE-DDS bridge. This puts PX4 uORB topics directly on
  # the ROS 2 graph and breaks the MAVLink-only contract on purpose. Turn it on
  # only for a stack that needs px4_msgs.
  # Profile: xrce
  # -------------------------------------------------------------------------
  xrce-agent:
    profiles: [xrce]
    build:
      context: ./modules/ros
      dockerfile: Dockerfile.xrce
      args:
        XRCE_AGENT_REF: ${XRCE_AGENT_REF:-v2.4.2}
    image: px4simstack/xrce-agent:${XRCE_AGENT_REF:-v2.4.2}
    hostname: xrce-agent
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    command: ["MicroXRCEAgent", "udp4", "-p", "8888"]
    networks:
      simnet:
        ipv4_address: 172.28.0.18

networks:
  simnet:
    driver: bridge
    ipam:
      config:
        # A fixed subnet keeps the PX4 broadcast address predictable and keeps
        # the range clear of the usual corporate VPN ranges.
        - subnet: 172.28.0.0/16

volumes:
  sim-ccache:
  sim-fuel:
  qgc-config:
  qgc-dev-ccache:
  perception-cache:
